[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "kev"
version = "0.1.0"
description = "Decision model service with a TypeSafe-compatible /v1/systemone API"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Jared Palmer" }]
requires-python = ">=3.12,<3.14"
dependencies = [
    "accelerate>=1.15.0",
    "fastapi>=0.115",
    "peft>=0.21",
    "pydantic>=2.9",
    "torch>=2.6,<2.9",
    "transformers>=5.17,<6",
    "typesafe-sdk>=0.6.0",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
mlx = [
    "mlx-lm>=0.31.3,<0.32; sys_platform == 'darwin' and platform_machine == 'arm64'",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["server: needs a running kev.serve instance (KEV_BASE_URL)"]

[tool.setuptools]
packages = ["kev"]
